name: Update Panel Data

on:
  # 2026-11-12: schedule 迁移至阿里云中继（scripts/relay_run_scan.sh update 模式，11:00/13:30）
  # 根因：GitHub schedule 高负载日静默失守（实锤 2026-11-12 上午全 miss）；workflow_dispatch 保留应急
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # 2026-11-12: naive datetime.now() 在 UTC Runner 偏 8h（update_data.py updated 字段）
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run update script
        run: python3 update_data.py
      
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "auto: update data.json $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push
