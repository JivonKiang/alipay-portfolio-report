name: Right-Side Scan (MACD+KDJ)

on:
  # 2026-11-12: schedule 迁移至阿里云中继（scripts/relay_run_scan.sh scan 模式，14:10）
  # 根因：GitHub schedule 高负载日静默失守（实锤 2026-11-12 上午全 miss）；workflow_dispatch 保留应急
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # 2026-11-12: naive datetime.now() 在 UTC Runner 偏 8h
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run MACD+KDJ Right-Side Scanner
        run: python3 scanner.py

      - name: Commit updated scan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan/data.json
          git diff --staged --quiet || (git commit -m "scan: MACD+KDJ 右侧扫描 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')" && git push)
        # Pages 为「main 分支根目录」模式，push 后自动重建站点，无需额外部署步骤
