name: Right-Side Scan (MACD+KDJ)

on:
  schedule:
    # UTC 6:10 = 北京时间 14:10（周一至周五）
    - cron: '10 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run MACD+KDJ Right-Side Scanner
        run: python3 scanner.py

      - name: Commit updated scan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/scan/data.json
          git diff --staged --quiet || (git commit -m "scan: MACD+KDJ 右侧扫描 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')" && git push)

      - name: Deploy full output (main panel + scan panel) to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: pages ${{ github.sha }}"
