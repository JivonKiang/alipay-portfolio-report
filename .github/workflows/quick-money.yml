name: Quick Money Hourly Scan

on:
  # 2026-11-12: schedule 迁移至阿里云中继（scripts/relay_run_scan.sh quickmoney 模式，9:00-15:00 整点）
  # 根因：GitHub schedule 高负载日静默失守（实锤 2026-11-12 上午全 miss）；workflow_dispatch 保留应急
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # 2026-11-12: naive datetime.now() 在 UTC Runner 偏 8h（quick_money.py 用 now().hour 判盘中盘后）
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run quick money scan
        run: python quick_money.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quick_money.json cache/
          if git diff --staged --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "快钱模块数据更新 [$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')]"
            git pull --rebase origin main || true
            git push
          fi
