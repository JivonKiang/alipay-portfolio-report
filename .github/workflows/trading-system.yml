name: Trading System (5-Module)

on:
  schedule:
    # 北京时间 11:00 → UTC 3:00 (周一至周五)
    - cron: '0 3 * * 1-5'
    # 北京时间 14:30 → UTC 6:30 (周一至周五)
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 5-Module Trading System
        env:
          # 邮件日报（可选）: 在仓库 Secrets 配置后自动推送，未配置则跳过
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 trading_system.py

      - name: Data integrity gate (block deploy on incomplete scan)
        run: |
          # 2026-11-11 闸门：防东财限流时残缺数据(如 scanned=19)上线面板
          python3 - <<'EOF'
          import json, sys
          with open("output/trading_data.json", encoding="utf-8") as f:
              d = json.load(f)
          sel = (d.get("module_2_selection") or {})
          scanned = sel.get("scanned") or 0
          if scanned < 20:
              sys.exit(f"GATE FAIL: module_2_selection.scanned={scanned} < 20 (data incomplete, refusing to publish)")
          print(f"GATE PASS: scanned={scanned}")
          EOF

      - name: Copy investment hub panel to output
        run: |
          cp hub.html output/hub.html
          cp data.json output/main-data.json
          cp CNAME output/CNAME
          # jivonQuant (jq) 主战系统面板数据（jq 侧 tests/export_panel.py 产出，随仓同步）
          cp jq_panel.json output/jq_panel.json 2>/dev/null || echo '{"error":"jq_panel not generated"}' > output/jq_panel.json

      - name: Run Q75 quant executor (75% win-rate paper trading)
        run: |
          python3 -m pip install pandas --quiet
          python3 q75/q75_executor.py
          cp q75/q75_signal.json output/q75_signal.json
          cp q75/q75_trades.json output/q75_trades.json 2>/dev/null || echo "[]" > output/q75_trades.json
          cp q75/q75_ledger.json output/q75_ledger.json 2>/dev/null || true
          # Pages legacy 模式服务 main 分支根目录：JSON 必须复制到根，hub.html 相对 fetch 才能命中
          cp q75/q75_signal.json q75_signal.json
          cp q75/q75_trades.json q75_trades.json 2>/dev/null || echo "[]" > q75_trades.json
          cp q75/q75_ledger.json q75_ledger.json 2>/dev/null || true

      - name: Run jq forward logger (生产池线性卡 ms0.75 前瞻记录)
        run: |
          python3 q75/jq_forward_logger.py
          # 前瞻验证账本同步到面板输出（手机端可查）
          cp q75/jq_forward_log.jsonl output/jq_forward_log.jsonl 2>/dev/null || true
          cp q75/jq_forward_log.jsonl jq_forward_log.jsonl 2>/dev/null || true

      - name: Commit updated data & dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 添加输出文件
          git add output/trading_data.json
          git add output/index.html
          git add index.html
          git add cache/trading_history.json 2>/dev/null || true
          git add q75/q75_signal.json q75/q75_trades.json q75/q75_ledger.json 2>/dev/null || true
          git add q75/jq_forward_log.jsonl q75_signal.json q75_trades.json q75_ledger.json jq_forward_log.jsonl 2>/dev/null || true
          git add q75_signal.json q75_trades.json q75_ledger.json 2>/dev/null || true

          git diff --staged --quiet || git commit -m "auto: trading system update $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: trading dashboard ${{ github.sha }}"
